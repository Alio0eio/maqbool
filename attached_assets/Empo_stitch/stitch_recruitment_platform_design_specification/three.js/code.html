<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_104 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_104" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_104');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create a subtle "Career Compass" / Geometric Star
const group = new THREE.Group();
scene.add(group);

const material = new THREE.MeshPhongMaterial({
    color: 0x1e3a8a,
    shininess: 100,
    specular: 0x444444,
    transparent: true,
    opacity: 0.8
});

// A multi-layered geometric structure
const coreGeom = new THREE.IcosahedronGeometry(1, 0);
const core = new THREE.Mesh(coreGeom, material);
group.add(core);

const wireGeom = new THREE.IcosahedronGeometry(1.2, 1);
const wireMat = new THREE.MeshBasicMaterial({ 
    color: 0x1e3a8a, 
    wireframe: true, 
    transparent: true, 
    opacity: 0.2 
});
const wireframe = new THREE.Mesh(wireGeom, wireMat);
group.add(wireframe);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

camera.position.z = 3;

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
const onMouseMove = (event) => {
    mouseX = (event.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
};
window.addEventListener('mousemove', onMouseMove);

const animate = () => {
    requestAnimationFrame(animate);
    
    group.rotation.y += 0.005;
    group.rotation.x += 0.002;
    
    // Subtle float and tilt
    group.position.y = Math.sin(Date.now() * 0.001) * 0.1;
    group.rotation.y += mouseX * 0.02;
    group.rotation.x += mouseY * 0.02;
    
    renderer.render(scene, camera);
};

animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_104 -->
</body>
</html>
